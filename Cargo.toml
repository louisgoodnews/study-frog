[workspace]
resolver = "3"
members = [
    "crates/studyfrog-core",
    "crates/studyfrog-config",
    "crates/studyfrog-graph",
    "crates/studyfrog-md",
    "crates/studyfrog-store",
    "crates/studyfrog-srs",
    "crates/studyfrog-rehearsal",
    "crates/studyfrog-slm",
    "crates/studyfrog-agent",
    "crates/studyfrog-pdf",
    "crates/studyfrog-net",
    "crates/studyfrog-candle",
    "crates/studyfrog-report",
    "crates/studyfrog-achieve",
    "crates/studyfrog-board",
    "crates/studyfrog-calendar",
    "crates/studyfrog-service",
    "crates/studyfrog-ext",
    "examples/studyfrog-ext-example",
    "crates/studyfrog-ui",
    "crates/studyfrog-app",
]

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
authors = ["louisgoodnews"]

# Shared third-party dependencies. Crates opt in with `dep.workspace = true`.
# Nothing is consumed yet (M0 is scaffolding only); versions are pinned at first use.
[workspace.dependencies]
# internal crates
studyfrog-core = { path = "crates/studyfrog-core" }
studyfrog-config = { path = "crates/studyfrog-config" }
studyfrog-graph = { path = "crates/studyfrog-graph" }
studyfrog-md = { path = "crates/studyfrog-md" }
studyfrog-store = { path = "crates/studyfrog-store" }
studyfrog-srs = { path = "crates/studyfrog-srs" }
studyfrog-rehearsal = { path = "crates/studyfrog-rehearsal" }
studyfrog-slm = { path = "crates/studyfrog-slm" }
studyfrog-agent = { path = "crates/studyfrog-agent" }
studyfrog-pdf = { path = "crates/studyfrog-pdf" }
hayro = "0.8"
pdf_oxide = { version = "0.3", default-features = false, features = ["icc"] }
lopdf = "0.46"
studyfrog-net = { path = "crates/studyfrog-net" }
studyfrog-candle = { path = "crates/studyfrog-candle" }
studyfrog-report = { path = "crates/studyfrog-report" }
studyfrog-achieve = { path = "crates/studyfrog-achieve" }
studyfrog-board = { path = "crates/studyfrog-board" }
studyfrog-calendar = { path = "crates/studyfrog-calendar" }
studyfrog-service = { path = "crates/studyfrog-service" }
studyfrog-ext = { path = "crates/studyfrog-ext" }
studyfrog-ext-example = { path = "examples/studyfrog-ext-example" }
studyfrog-ui = { path = "crates/studyfrog-ui" }

# third party (added at first use)
criterion = { version = "0.8", default-features = false }
proptest = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2"
pulldown-cmark = { version = "0.13", default-features = false }
toml = { version = "1", default-features = false, features = ["parse", "serde", "display"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dhat = "0.3"
rfd = "0.17"
serde_json = "1"
ron = "0.12"
zip = { version = "9", default-features = false, features = ["deflate"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
unicode-normalization = { version = "0.1", default-features = false, features = ["std"] }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "wayland", "x11"] }
egui_kittest = "0.37"
egui_extras = { version = "0.37", default-features = false, features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
too_many_lines = "warn"
cognitive_complexity = "warn"
disallowed_methods = "deny"
unwrap_used = "warn"
expect_used = "warn"

# Smaller debug info: much faster linking of the many test binaries, backtraces keep line numbers.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
