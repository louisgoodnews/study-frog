# Curated Ollama models for the setup assistant (STORY-0206). Shipped with the app; refreshed in releases.
#   name                the tag to pull, as `ollama pull NAME` takes it
#   parameters          the parameter count as people write it
#   parameters_millions the same count in millions, for ranking
#   quantization        the quantization of the default build
#   download_bytes      the size of the download in bytes (leave out when unknown: never ranked as fitting)
#   memory_bytes        the memory needed to run it (weights, cache and working space), in bytes
# The sizes are approximate values from the Ollama library; check them with `ollama show NAME`
# before a release.

[[model]]
name = "qwen2.5:0.5b"
parameters = "0.5B"
parameters_millions = 500
quantization = "Q4_K_M"
download_bytes = 398000000
memory_bytes = 900000000

