name: ci

on:
  push:
    branches: [main]
  pull_request:

# Debug info off: the runner's disk cannot hold the linked debug test binaries (the linker failed with a bus error on release 1.1.0).
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for the window and the folder dialog
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev pkg-config desktop-file-utils
      - name: Gate (format, lint, tests, line count, layering, issues)
        run: scripts/check.sh

  appimage:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev pkg-config desktop-file-utils
      - name: Build the AppImage
        run: scripts/package-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: studyfrog-appimage
          path: target/appimage/*.AppImage
          if-no-files-found: error
