name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for the window and the folder dialog
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev pkg-config
      - name: Gate (format, lint, tests, line count, layering, issues)
        run: scripts/check.sh

  appimage:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev pkg-config
      - name: Build the AppImage
        run: scripts/package-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: studyfrog-appimage
          path: target/appimage/*.AppImage
          if-no-files-found: error
